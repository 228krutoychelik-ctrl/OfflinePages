
name: Build OfflinePages APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OfflinePages-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f OfflinePages-project.zip
          unzip -t OfflinePages-project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q OfflinePages-project.zip -d extracted
          test -f extracted/OfflinePages/settings.gradle
          test -f extracted/OfflinePages/app/build.gradle
          test -f extracted/OfflinePages/app/src/main/AndroidManifest.xml
          test -f extracted/OfflinePages/app/src/main/assets/index.html

      - name: Build APK
        working-directory: extracted/OfflinePages
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s extracted/OfflinePages/app/build/outputs/apk/debug/app-debug.apk
          ls -lh extracted/OfflinePages/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePages-debug-apk
          path: extracted/OfflinePages/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
